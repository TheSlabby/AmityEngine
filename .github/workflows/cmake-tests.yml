name: CMake Build and Test Suite

on:
  push:
  pull_request:
    branches: [ main ]

env:
  BUILD_TYPE: Debug
  # vcpkg caches built packages here; the folder is saved/restored with actions/cache below
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache

jobs:
  build-and-test:
    name: Build & Test (Windows MSVC)
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up vcpkg
      run: |
        # the runner ships with vcpkg preinstalled; point the CMake preset at it
        echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
        New-Item -ItemType Directory -Force "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}" | Out-Null

    - name: Restore vcpkg packages
      id: vcpkg-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Configure CMake
      run: cmake --preset windows

    # save right after vcpkg has built everything, even if a later step fails
    - name: Save vcpkg packages
      if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

    - name: Build AmityTests Target
      run: cmake --build build/windows --config ${{ env.BUILD_TYPE }} --target AmityTests

    - name: Execute Automated Unit Tests (CTest)
      run: ctest --test-dir build/windows -C ${{ env.BUILD_TYPE }} --output-on-failure
